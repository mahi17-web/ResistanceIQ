name: ResistanceIQ — Production CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── 1. Backend, ML & Security Quality Gate ──────────────────────────────────
  backend-and-ml-verification:
    name: Backend, ML & Cryptographic Integrity Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Locked Model SHA-256 Checksum
        run: |
          python -c "
          import hashlib
          expected = '6fc915fa26716dc4a06bad71f586af95ee071acf11e9a5b8acdc5171fed55622'
          actual = hashlib.sha256(open('resistanceiq/storage/models/v2.0.0-gbrt-ecfp4.joblib', 'rb').read()).hexdigest()
          print(f'Expected SHA256: {expected}')
          print(f'Actual SHA256:   {actual}')
          assert actual == expected, 'FATAL: Model artifact SHA256 checksum mismatch!'
          print('Model artifact cryptographic integrity verified successfully.')
          "

      - name: Run Full Pytest Suite
        run: |
          python -m pytest resistanceiq/tests/ -v

      - name: Run Dedicated Security & Hardening Suite
        run: |
          python -m pytest resistanceiq/tests/security/ -v

  # ─── 2. Frontend Lint & Build Quality Gate ───────────────────────────────────
  frontend-verification:
    name: Frontend Lint & Production Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Verification
        run: npm run lint

      - name: Run Vite Production Bundle Build
        run: npm run build
